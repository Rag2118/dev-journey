<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ES6-Template-Literals</title>
    </head>

    <body>
        <h1>Template-Literals</h1>
        <script>
            let name="Raghul";
            let age=20;
            let course="Bsc IT";
            let college="GRD College Of Science";
            let introduction=
            `Hello! My name is ${name}.
            I am ${age} years old.
            I am studying ${course}.
            My college is ${college}.
            Next year I will be ${age+1} years old.`;
            console.log(introduction);
        </script>
    </body>
</html>
